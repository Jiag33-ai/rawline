name: build
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  golden:
    # The real shader pipeline on Mesa llvmpipe against stored reference renders.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesa and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libegl-mesa0 cmake python3-pil
      - name: Golden render tests
        run: ./tools/golden/run-golden.sh
      - name: Model download links are alive
        run: ./tools/models/fetch.sh
      - name: Preview parser test on real S5IIX files
        run: |
          mkdir -p testdata
          curl -fsSL -o testdata/P1055415.RW2 https://raw.pixls.us/data/Panasonic/DC-S5M2X/P1055415.RW2
          ./tools/test-preview-parser.sh

  build:
    needs: golden
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK and NDK
        run: ./tools/setup-sdk.sh
      - name: Unit tests
        run: |
          source tools/env.sh
          ./gradlew testDebugUnitTest --no-daemon
      - name: Decode signing key
        id: key
        env:
          KS_B64: ${{ secrets.RAWLINE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rawline.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        env:
          RAWLINE_KEYSTORE: ${{ runner.temp }}/rawline.jks
          RAWLINE_KEYSTORE_PASSWORD: ${{ secrets.RAWLINE_KEYSTORE_PASSWORD }}
          RAWLINE_KEY_ALIAS: ${{ secrets.RAWLINE_KEY_ALIAS }}
          RAWLINE_KEY_PASSWORD: ${{ secrets.RAWLINE_KEY_PASSWORD }}
        run: |
          source tools/env.sh
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk rawline.apk
      - name: Build release APK with the committed sideload key
        if: steps.key.outputs.signed != 'true'
        run: |
          source tools/env.sh
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk rawline.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          NOTE="Build ${{ github.run_number }}, commit ${GITHUB_SHA::7}. Signed: ${{ steps.key.outputs.signed }}"
          # Re-running a job keeps the run number, so update the release if it exists; always tag the built commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rawline.apk --clobber
          else
            gh release create "$TAG" rawline.apk --target "$GITHUB_SHA" --title "Rawline $TAG" --notes "$NOTE"
          fi
